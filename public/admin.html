<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halo admin</title><meta name="robots" content="noindex"><link rel="icon" href="/icon.svg"><style>
:root{--bg:#f4f2ff;--card:#fff;--fg:#1b1730;--mute:#6b6785;--ac:#7b5cff;--ln:#e6e2fa}@media(prefers-color-scheme:dark){:root{--bg:#0f0d1a;--card:#191529;--fg:#ece9ff;--mute:#9a96b8;--ln:#2a2545}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--ln)}header b{font-size:18px;flex:1}.ring{width:20px;height:20px;border-radius:50%;border:3px solid var(--ac)}
nav{display:flex;gap:8px;padding:12px 24px}nav button,.btn{border:0;border-radius:10px;padding:8px 14px;background:var(--card);color:var(--fg);font:600 13px inherit;cursor:pointer}nav button.on,.btn.pk{background:var(--ac);color:#fff}
main{padding:0 24px 40px;max-width:1100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0}.card{background:var(--card);border-radius:14px;padding:16px}.card b{font-size:26px;display:block}.card small,.m{color:var(--mute)}
.big{font-size:44px;font-weight:800}.bar{height:10px;border-radius:10px;background:rgba(123,92,255,.18);overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--ac)}
.wk{display:flex;align-items:flex-end;gap:10px;height:120px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--mute)}.wk i{display:block;background:var(--ac);border-radius:5px;margin-bottom:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--ln)}th{color:var(--mute);font-weight:600;font-size:12px}
#login{max-width:340px;margin:12vh auto;padding:0 16px}#login input{width:100%;padding:10px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--fg);font:inherit}[hidden]{display:none!important}.err{color:#d6372b;min-height:20px}
</style></head><body>
<div id="login" hidden><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><span class="ring"></span><b style="font-size:20px">Halo admin</b></div><p class="m">Sign in with your Halo account (the admin one).</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="btn pk" id="go" style="width:100%;margin-top:8px;padding:10px">Sign in</button><div id="clm" hidden style="margin:12px 0"><p class="m" id="clt"></p><input id="pn" type="password" placeholder="Admin PIN (6 or more characters)" autocomplete="off"><button class="btn pk" id="cb" style="width:100%;margin-top:8px;padding:10px">Take admin</button></div><p class="err" id="er"></p><p class="m" style="font-size:12px;margin-top:14px">No password? In the Halo app open You, then <b>Sign in on a computer</b>, and type the code here.</p><input id="c" placeholder="Code from the app" autocomplete="off" autocapitalize="characters"><button class="btn" id="gc" style="width:100%;margin-top:8px;padding:10px">Sign in with code</button></div>
<div id="app" hidden><header><span class="ring"></span><b>Halo admin</b><small class="m" id="upd"></small><button class="btn" id="out">Sign out</button></header><nav id="tabs"></nav><main id="main"></main></div>
<script src="/admin.js"></script></body></html>
