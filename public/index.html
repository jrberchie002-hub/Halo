<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#ff4f7b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>Halo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#171316;--mute:#7a7077;--line:#e8e0d6;--pink:#ff4f7b;--sun:#ffd23f;--theirs:#efe7dc;--glass:rgba(255,253,249,.78);--shadow:0 8px 28px rgba(60,30,40,.12);--spot:#1db954}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0c10;--card:#191519;--ink:#f6f0ee;--mute:#a3979e;--line:#2a2429;--theirs:#2a232a;--glass:rgba(25,21,25,.8);--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0c10;--card:#191519;--ink:#f6f0ee;--mute:#a3979e;--line:#2a2429;--theirs:#2a232a;--glass:rgba(25,21,25,.8);--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 'DM Sans',system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
h1,h2,.hd{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:0}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.app{position:relative;width:100%;height:100dvh;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){.stage{background:linear-gradient(160deg,#ffd9e2,#ffe9c7)}.app{width:390px;height:min(844px,calc(100dvh - 32px));border-radius:44px;box-shadow:0 30px 80px rgba(60,20,40,.3),0 0 0 10px #171316}}
.top{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px}
.top .t{font-size:28px;font-weight:800;flex:1}
.ic{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;position:relative;flex:none;transition:transform .15s}
.ic:active{transform:scale(.88)}
.ic svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.dk{background:var(--ink)}.ic.dk svg{stroke:var(--card)}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--pink);border:2px solid var(--bg)}
.search{margin:0 16px 8px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:0 12px;height:42px;text-align:left;width:calc(100% - 32px);color:var(--mute)}
.search svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.search input{flex:1;border:0;background:none;outline:0;min-width:0}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.body::-webkit-scrollbar,.msgs::-webkit-scrollbar{display:none}
.nav{position:absolute;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;padding:6px;border-radius:28px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--shadow);z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute);padding:7px 0;position:relative;border-radius:22px;transition:background .2s,color .2s}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:#fff;background:var(--ink)}
:root:not([data-theme="light"]) .nav button.on{}
.nav .badge{position:absolute;top:1px;left:calc(50% + 4px);background:var(--pink);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;color:#fff;background-size:cover;background-position:center;position:relative}
.ringw{width:56px;height:56px;border-radius:50%;padding:3px;background:var(--line);display:grid;place-items:center;flex:none}
.ringw.new{background:conic-gradient(#ff4f7b,#ffb02e,#ff4f7b)}
.ringw .av{width:100%;height:100%;border:3px solid var(--card)}
.on-dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--spot);border:2.5px solid var(--card)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}
.row:active{background:var(--bg)}
.row .m{flex:1;min-width:0}.row b{display:block;font-weight:700}
.row .s{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.u{color:var(--ink);font-weight:700}
.row .r{text-align:right;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.unread{background:var(--pink);color:#fff;border-radius:10px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:700;padding:0 6px}
.fire{font-size:13px;font-weight:700;color:#e8590c;margin-left:4px}
.sec{padding:12px 18px 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pill{background:var(--ink);color:var(--card);border-radius:20px;padding:9px 16px;font-weight:700;font-size:13px;transition:transform .15s;display:inline-block;text-decoration:none;text-align:center}
.pill:active{transform:scale(.94)}.pill.soft{background:var(--bg);color:var(--ink)}.pill.pk{background:var(--pink);color:#fff}.pill.sp{background:var(--spot);color:#06210f}
.cta{width:100%;height:52px;border-radius:26px;background:var(--pink);color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(255,79,123,.3);transition:transform .15s}
.cta:active{transform:scale(.97)}.cta.ghost{background:var(--bg);color:var(--ink);box-shadow:none}.cta:disabled{opacity:.5}
.stories{display:flex;gap:12px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;width:64px;flex:none}
.st span{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{width:56px;height:56px;border-radius:50%;border:2px dashed var(--pink);display:grid;place-items:center;color:var(--pink);font-size:26px;font-weight:300}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}
.tile{aspect-ratio:3/4;border-radius:18px;position:relative;overflow:hidden;color:#fff;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;transition:transform .2s}
.tile:active{transform:scale(.97)}.tile .tx{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.4);position:relative;z-index:2}
.tile small{font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.5);position:relative;z-index:2}
.tile .stk{position:absolute;font-size:30px;transform:translate(-50%,-50%);z-index:1}
.sheet{position:absolute;inset:0;background:var(--card);z-index:20;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bar .nm{flex:1;min-width:0}.bar .nm b{display:block;font-family:'Bricolage Grotesque';font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .nm small{color:var(--mute)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:5px;min-height:0;scrollbar-width:none}
.b{max-width:80%;padding:9px 13px;border-radius:20px;word-wrap:break-word;overflow-wrap:anywhere;position:relative;animation:pop .22s cubic-bezier(.3,1.5,.5,1) both;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px;transform-origin:bottom right}
.b.th{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:6px;transform-origin:bottom left}
.b a{color:inherit;text-decoration:underline}
.b .rx{position:absolute;bottom:-11px;right:8px;background:var(--card);color:var(--ink);border-radius:12px;padding:1px 6px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.b.hasr{margin-bottom:10px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.time{align-self:center;font-size:11px;color:var(--mute);font-weight:700;margin:8px 0 2px}
.seen{align-self:flex-end;font-size:11px;color:var(--mute);margin:0 4px}
.link{display:flex;gap:10px;align-items:center;margin-top:7px;padding:9px;border-radius:14px;background:rgba(0,0,0,.12);text-decoration:none!important;color:inherit}
.link .li{width:38px;height:38px;border-radius:10px;background:var(--sun);color:#171316;display:grid;place-items:center;font-size:19px;flex:none}
.link b{display:block;font-size:13px}.link span{font-size:12px;opacity:.8;word-break:break-all}
.img{display:block;max-width:100%;max-height:300px;border-radius:14px;margin:-3px 0 2px;cursor:zoom-in}
.typing{align-self:flex-start;background:var(--theirs);border-radius:20px;border-bottom-left-radius:6px;padding:13px 15px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bn 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
.compose{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);align-items:flex-end;background:var(--card)}
.compose textarea{flex:1;resize:none;border:0;background:var(--bg);border-radius:20px;padding:11px 14px;outline:0;max-height:110px;min-height:42px;overflow:hidden;scrollbar-width:none}
.send{width:42px;height:42px;border-radius:50%;background:var(--pink);display:grid;place-items:center;flex:none;transition:transform .15s}
.send:active{transform:scale(.88)}.send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sv{position:absolute;inset:0;z-index:30;background:#111;color:#fff;display:flex;flex-direction:column;animation:up .25s ease;overflow:hidden}
.sv .bars{display:flex;gap:4px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 6px;position:relative;z-index:3}
.sv .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}.sv .bars i b{display:block;height:100%;width:0;background:#fff}
.sv .bars i.d b{width:100%}.sv .bars i.a b{animation:fill 5s linear forwards}.sv.paused .bars i.a b{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.sv .who{display:flex;align-items:center;gap:10px;padding:4px 14px;position:relative;z-index:3}.sv .who .av{width:36px;height:36px;font-size:15px}
.sv .stg{position:absolute;inset:0;background-size:cover;background-position:center}
.sv .stg .tx{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);text-align:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:32px;line-height:1.1;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.stg .stk{position:absolute;transform:translate(-50%,-50%);line-height:1}
.sv .tapz{position:absolute;inset:0;display:flex;z-index:1}.sv .tapz div{flex:1}.sv .tapz div:first-child{flex:.35}
.sv .reply{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px}
.sv .reply input{flex:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:11px 16px;outline:0;color:#fff}
.sv .reply input::placeholder{color:rgba(255,255,255,.8)}
.comp{flex:1;position:relative;min-height:0;display:flex}
.cv{flex:1;position:relative;background-size:cover;background-position:center;overflow:hidden;touch-action:none}
.cv textarea{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);background:none;border:0;outline:0;resize:none;text-align:center;color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1.1;text-shadow:0 2px 16px rgba(0,0,0,.35);overflow:hidden}
.cv textarea::placeholder{color:rgba(255,255,255,.75)}
.cv .stk{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:grab;touch-action:none;user-select:none;padding:4px}
.cv .stk.sel{outline:2px dashed #fff;border-radius:12px}
.tools{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none;align-items:center}
.tools::-webkit-scrollbar{display:none}
.tools .c{width:30px;height:30px;border-radius:50%;flex:none;border:3px solid var(--card);outline:2px solid transparent}.tools .c.on{outline-color:var(--ink)}
.tools .e{font-size:26px;flex:none;width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.toast{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:60;background:var(--ink);color:var(--card);border-radius:18px;padding:11px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:drop .35s cubic-bezier(.3,1.4,.5,1);text-align:left}
.toast .av{width:34px;height:34px;font-size:14px}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.call{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:30px;background:linear-gradient(160deg,#ff4f7b,#b3195a);overflow:hidden}
.call video.rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.call video.lv{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:96px;height:140px;object-fit:cover;border-radius:16px;z-index:2;border:2px solid rgba(255,255,255,.7);background:#000;transform:scaleX(-1)}
.call>*:not(video){position:relative;z-index:1}
.call .big{width:128px;height:128px;font-size:50px;position:relative}
.call .big::before,.call .big::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:pulse 2s infinite}.call .big::after{animation-delay:1s}
@keyframes pulse{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}
.call .ctl{display:flex;gap:18px;margin-top:40px}
.call .ctl button{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.call .ctl button.on{background:#fff;color:#171316}.call .ctl .end{background:#ff3b4e}.call .ctl .ok{background:#1db954}
.call svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{display:block;padding:7px 16px}.field span{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}
.field input,.field textarea{width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:0}
.field input:focus,.field textarea:focus{border-color:var(--pink)}
.field small{display:block;margin-top:4px;font-size:12px;color:var(--mute)}.field small.ok{color:#1b8a4b}.field small.bad{color:#d6372b}
.empty{text-align:center;color:var(--mute);padding:40px 28px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 16px}
.hero .av{width:96px;height:96px;font-size:38px}
.cam{position:absolute;bottom:0;right:0;width:30px;height:30px;border-radius:50%;background:var(--sun);color:#171316;display:grid;place-items:center;border:3px solid var(--card);font-size:14px}
.chip{display:inline-flex;gap:6px;background:var(--bg);border-radius:14px;padding:6px 12px;font-weight:700;font-size:13px}
.soc{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px}
.soc a{display:inline-flex;gap:6px;padding:8px 13px;border-radius:14px;background:var(--bg);font-weight:700;font-size:13px;text-decoration:none;color:var(--ink)}
.np{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--bg);margin:6px 16px;font-size:13px}
.np .m{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--spot);border-radius:2px;animation:eq 1s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:10px}
.mark{font-family:'Bricolage Grotesque';font-weight:800;font-size:76px;letter-spacing:-.05em;line-height:.9}.mark i{color:var(--pink);font-style:normal}
.key{font-family:'DM Sans';font-weight:700;font-size:24px;letter-spacing:.06em;text-align:center;padding:18px;border-radius:18px;background:var(--bg);border:2px dashed var(--pink);word-break:break-all}
.menu{background:var(--bg);border-radius:18px;margin:6px 16px;overflow:hidden}
.lb{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}.lb img{max-width:100%;max-height:100%;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="stage"><div class="app" id="app"></div></div>
<script src="/app.js"></script>
</body>
</html>
