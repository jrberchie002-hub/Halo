<style>
:root{--bg:#efedea;--card:#ffffff;--ink:#141214;--mute:#86807f;--line:#e5e1dd;--bth:#ffffff;--pink:#f1ede6;--on:#0f0c10;--sun:#ffd23f;--theirs:#e6e3df;--glass:rgba(255,255,255,.82);--shadow:0 8px 28px rgba(30,24,30,.10);--spot:#1db954}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}

.link{display:flex;gap:10px;align-items:center;margin-top:7px;padding:9px;border-radius:14px;background:rgba(0,0,0,.12);text-decoration:none!important;color:inherit}

.compose{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);align-items:flex-end;background:var(--card)}

.sv{position:absolute;inset:0;z-index:30;background:#111;color:#fff;display:flex;flex-direction:column;animation:up .25s ease;overflow:hidden}

.comp{flex:1;position:relative;min-height:0;display:flex}
.cv{flex:1;position:relative;background-size:cover;background-position:center;overflow:hidden;touch-action:none}

.field{display:block;padding:7px 16px}.field span{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}

.mark{font-family:'Bricolage Grotesque';font-weight:800;font-size:76px;letter-spacing:-.05em;line-height:.9}.mark i{color:var(--pink);font-style:normal}

.lb{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}.lb img{max-width:100%;max-height:100%;border-radius:12px}

.tg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:168px;overflow:auto;scrollbar-width:none}.tg::-webkit-scrollbar{display:none}.tg button{font-size:27px;height:42px;border-radius:12px}.tg button:active{background:var(--bg);transform:scale(1.2)}
